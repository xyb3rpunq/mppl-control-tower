name: terbitkan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu penerbitan pada satu waktu. Antrean tidak dibatalkan supaya commit yang
# sedang dalam perjalanan tetap sampai ke produksi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    name: Bangun situs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Uji sebelum menerbitkan
        run: go test -count=1 ./...

      - name: Kompilasi mesin hitung ke WebAssembly
        run: |
          GOOS=js GOARCH=wasm go build -o web/static/js/mppl.wasm ./cmd/wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/static/js/wasm_exec.js

      - name: Bangun situs statis
        run: go run ./cmd/site -out dist -base "${{ steps.pages.outputs.base_url || 'https://xyb3rpunq.github.io/mppl-control-tower' }}"

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  terbitkan:
    name: Terbitkan ke GitHub Pages
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
